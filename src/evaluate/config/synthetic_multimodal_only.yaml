# Synthetic dataset — multimodal-only subset (R1.1, condition A).
#
# Runs the VLM against the multimodal subset of the test split with images
# attached. Pair with synthetic_image_mask.yaml (condition B) to obtain the
# matched-task image-contribution delta.

model:
  base_url: "${MODEL_BASE_URL}"
  api_key: "${API_KEY}"
  model_name: "${MODEL_NAME}"
  max_tokens: 4096
  temperature: 0.0
  timeout: 300.0
  is_vlm: true

dataset:
  type: "synthetic"
  path: "${SYNTH_DATASET_PATH}"
  images_dir: null
  split: "test"
  max_samples: null
  text_only: false
  multimodal_only: true
  mask_images: false

metrics:
  num_samples_per_task: 1
  k_values: [1]
  execution_timeout: 60
  max_concurrent: 16
  system_prompt_type: "qiskit_humaneval"
  custom_system_prompt: null
  verify_canonical: false

output:
  results_file: null
  results_dir: "outputs/evaluate/synthetic"
  auto_filename: true
